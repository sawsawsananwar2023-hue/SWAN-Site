<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Swan: منح وبرامج ومسابقات تعليمية بروابطها الرسمية ومواعيدها.">

<title>Swan — منصة الفرص التعليمية</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦢%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F7FB;--card:#fff;--ink:#16223B;--soft:#546079;--pri:#1B3A6B;--pri2:#2A57A6;--tint:#E8EEF9;--acc:#A8560F;--acc-t:#FBEBD9;--line:#D9DFEC;--ok:#1E6B45;--ok-t:#E6F3EC;--r:14px;--sh:0 10px 30px rgba(27,58,107,.10)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 Tajawal,Inter,system-ui,sans-serif}
[dir=ltr] body{font-family:Inter,Tajawal,system-ui,sans-serif;line-height:1.65}
h1,h2,h3{margin:0;font-weight:800;line-height:1.35;color:var(--pri)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 5%}
header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:16px;padding-bottom:16px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font:800 24px Inter,sans-serif;color:var(--pri);text-decoration:none}
nav{display:flex;align-items:center;gap:22px}
nav .links{display:flex;gap:22px}
nav a{text-decoration:none;color:var(--soft);font-size:15px;font-weight:500}
nav a:hover{color:var(--pri)}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;min-height:36px;min-width:48px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;color:var(--soft)}
.lang button[aria-pressed=true]{background:var(--pri);color:#fff}
.hero{text-align:center;padding:44px 0 28px}
.hero h1{font-size:clamp(34px,6vw,58px);max-width:780px;margin:0 auto}
.hero p{max-width:580px;margin:16px auto 0;color:var(--soft);font-size:17px}
.search{max-width:720px;margin:28px auto 0;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--sh)}
.search:focus-within{border-color:var(--pri2)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;padding:0 18px;font-size:16px}
.search input::placeholder{color:#6B7690}
.btn{background:var(--pri);color:#fff;border:0;border-radius:999px;padding:0 26px;min-height:46px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--pri2)}
.bar{display:grid;gap:10px;margin:30px 0 14px}#adv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fbtn{display:none}
.pills{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.pills button{flex:1 0 auto;min-height:42px;border:0;background:none;border-radius:10px;padding:0 16px;font-weight:700;color:var(--soft);cursor:pointer;white-space:nowrap}
.pills button[aria-pressed=true]{background:var(--pri);color:#fff}
select{min-height:46px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;font-size:15px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;color:var(--soft);font-size:15px;gap:10px}
.link{background:none;border:0;color:var(--pri2);font-weight:700;cursor:pointer;text-decoration:underline;min-height:40px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:var(--pri2)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;background:var(--tint);color:var(--pri)}
.badge.competition{background:var(--acc-t);color:var(--acc)}
.badge.program{background:var(--ok-t);color:var(--ok)}
.src{font-size:13px;color:var(--soft);font-weight:500}
.card h3{font-size:21px}
.desc{color:var(--soft);font-size:15px;margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;background:var(--bg);border:1px solid var(--line);color:var(--soft);padding:2px 10px;border-radius:8px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:2px;font-size:14px}
.due{background:var(--acc-t);color:var(--acc);font-weight:700;font-size:13px;padding:2px 10px;border-radius:8px}
.cta{border:1.5px solid var(--pri);background:none;color:var(--pri);border-radius:10px;min-height:42px;padding:0 16px;font-weight:700;cursor:pointer}
.cta:hover{background:var(--pri);color:#fff}
.ver{font-size:13px;color:var(--ok)}
.ver.no{color:var(--soft)}
.empty{text-align:center;padding:50px 10px;color:var(--soft);display:none}
.ov{position:fixed;inset:0;background:rgba(15,25,45,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.open{display:flex}
.modal{background:var(--card);border-radius:18px;max-width:600px;width:100%;max-height:90vh;overflow:auto;padding:26px;position:relative}
.x{position:absolute;top:12px;inset-inline-end:12px;width:44px;height:44px;border:0;background:var(--bg);border-radius:50%;font-size:24px;cursor:pointer}
.modal h3{font-size:25px;margin:12px 44px 10px 0}
[dir=ltr] .modal h3{margin:12px 0 10px 44px}
.modal h4{margin:18px 0 4px;font-size:16px;color:var(--pri)}
.modal p{margin:0;color:var(--soft)}
.modal .note{margin-top:16px;padding:10px 14px;border-radius:10px;background:var(--acc-t);color:#6B3A08;font-size:14px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.apply{background:var(--acc);color:#fff;text-decoration:none;border-radius:999px;padding:10px 22px;font-weight:700}
.apply:hover{background:#8A460B}
footer{background:var(--pri);color:#EEF2FB;margin-top:60px;padding:40px 0 24px}
footer .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px}
footer small{display:block;margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.2);color:#C9D3EA;font-size:14px}
footer a{color:#fff}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}#adv{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.grid{grid-template-columns:1fr}nav .links{display:none}.search{border-radius:18px;flex-wrap:wrap}.search input{min-height:44px;flex-basis:100%}.btn{flex:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

html{-webkit-tap-highlight-color:transparent;scroll-padding-top:12px}
.acct{min-height:42px;border:1.5px solid var(--pri);background:none;color:var(--pri);border-radius:999px;padding:0 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.acct.on{background:var(--pri);color:#fff}
.banner{display:none;background:var(--acc-t);color:#6B3A08;padding:10px 5%;font-size:15px;text-align:center}
.banner button{background:none;border:0;font-weight:800;text-decoration:underline;cursor:pointer;color:inherit;min-height:36px}
.fld{display:block;margin:14px 0 4px;font-weight:700;font-size:15px}
.fi{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;background:#fff}
.fi:focus{border-color:var(--pri2)}
.msg{margin-top:12px;min-height:24px;font-size:15px}.msg.err{color:#A12A1B}.msg.ok{color:var(--ok)}
.full{width:100%;margin-top:16px;min-height:50px}
.save{background:none;border:0;cursor:pointer;font-size:24px;min-width:44px;min-height:44px;color:var(--soft);margin:-8px}
.save[aria-pressed=true]{color:var(--acc)}
.bb{display:none;position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.bb button{flex:1;min-height:58px;border:0;background:none;font-size:13px;font-weight:700;color:var(--soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bb button[aria-pressed=true]{color:var(--pri)}
.bb i{font-style:normal;font-size:20px;line-height:1}
@media(max-width:680px){
 body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
 .bb{display:flex}
 .fbtn{display:block;min-height:46px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:700;cursor:pointer}
 #adv{display:none;grid-template-columns:1fr 1fr}#adv.open{display:grid}
 header .wrap{padding-top:10px;padding-bottom:10px}
 .hero{padding:24px 0 12px}.hero p{font-size:16px}
 .ov{align-items:flex-end;padding:0}
 .modal{border-radius:20px 20px 0 0;max-height:92vh;padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
 .mfoot{position:sticky;bottom:-20px;background:#fff;padding-bottom:6px}
 .apply{flex:1;text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center}
 .card{padding:18px}.card h3{font-size:20px}
 #acct{padding:0 12px;font-size:14px}
}
.fl{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;min-height:40px;font-size:14px}
.old{opacity:.6}
.modal p+p{margin-top:10px}
.ta{min-height:96px;padding:10px 14px;line-height:1.6}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row2 b{flex:1}.sm{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.ck{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:700}.ck input{width:22px;height:22px}
.av{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;font-size:13px;margin-inline-end:8px;vertical-align:middle;overflow:hidden}
.av.big{width:76px;height:76px;font-size:30px;margin:0}.av img{width:100%;height:100%;object-fit:cover}
@media(max-width:680px){.acct .nm{display:none}.acct .av{margin:0}}
</style>
</head>

<script>
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const CONTACT_EMAIL='swanplatform4@gmail.com'; // ضع هنا بريد المنصة عندما تنشئينه، وسيظهر في التذييل تلقائياً
/* v = تاريخ آخر تحقق مباشر (2026-10-12) | n = لم يُعاد التحقق منه بعد */
const D=[
{t:'program',f:'general',s:'high_school',src:'Yale University',fund:'free',dt:'2026-10-20',op:'now',od:['مفتوح الآن','Open now'],dk:['20 أكتوبر 2026 (قبول مبكر) / 20 يناير 2027','Oct 20, 2026 (Early Action) / Jan 20, 2027'],link:'https://africanscholars.yale.edu/',v:'2026-10-12',
ti:['Yale Young African Scholars 2027','Yale Young African Scholars 2027'],
ds:['برنامج أكاديمي وقيادي مجاني لطلاب الثانوية الأفارقة، بنسختين: ورشة عبر الإنترنت وقمة حضورية في رواندا.','A free academic and leadership program for African secondary students: an online workshop and a residential summit in Rwanda.'],
e:['العمر 14–18 سنة بحلول 15 يوليو 2027. مواطن أو مقيم دائم أو لاجئ في دولة أفريقية، ويدرس حالياً في مدرسة أفريقية. الصف 10 أو 11، وليس السنة الأخيرة. إتقان الإنجليزية.','Age 14–18 on July 15, 2027. Citizen, permanent resident or refugee of an African country, currently at school in Africa. Grade 10 or 11 (not final year). English fluency.'],
b:['لا رسوم تقديم. الورشة الإلكترونية 15–20 يوليو 2027، والقمة الحضورية في رواندا 7–15 أغسطس 2027 مع منح سفر حسب الحاجة.','No application fee. Online workshop July 15–20, 2027; residential summit in Rwanda Aug 7–15, 2027, with need-based travel grants.'],
h:['قدّم عبر بوابة YYAS الرسمية. القبول المبكر ينتهي 20 أكتوبر 2026 والنتيجة بحلول 18 ديسمبر. التقديم العادي ينتهي 20 يناير 2027 والنتيجة بحلول 20 مارس.','Apply on the official YYAS portal. Early Action closes Oct 20, 2026 (decision by Dec 18). Regular Decision closes Jan 20, 2027 (decision by Mar 20).']},
{t:'scholarship',f:'general',s:'undergraduate',src:'Türkiye Bursları (YTB)',fund:'full',dt:'2027-02-20',op:'2027-01-10',od:['10 يناير 2027 (متوقع)','Jan 10, 2027 (expected)'],dk:['حتى 20 فبراير 2027 (متوقع)','Until Feb 20, 2027 (expected)'],link:'https://turkiyeburslari.gov.tr/',v:'2026-10-12',
ti:['منحة تركيا Türkiye Bursları 2027','Türkiye Bursları Scholarship 2027'],
ds:['منحة حكومية تركية ممولة بالكامل للدراسة الجامعية في تركيا، تشمل الرسوم والإقامة ومخصصاً شهرياً.','A fully funded Turkish government scholarship for studying at Turkish universities, covering tuition, housing and a monthly stipend.'],
e:['للبكالوريوس: أقل من 21 سنة عند التقديم، ومعدل لا يقل عن 70% (90% للطب وطب الأسنان والصيدلة والبيطرة). يمكن اختيار حتى 12 جامعة/تخصصاً. قد يُطلب اختبار كمّي قبل المقابلة.','Bachelor: under 21 at application and at least 70% average (90% for medicine, dentistry, pharmacy, veterinary). Up to 12 university/program choices. A quantitative test may precede the interview.'],
b:['إعفاء كامل من الرسوم، مخصص شهري (نحو 4500 ليرة للبكالوريوس بحسب مصادر ثانوية)، وسنة لغة تركية قبل التخصص. التقديم مجاني.','Full tuition waiver, monthly stipend (about TL 4,500 for bachelor per secondary sources) and a Turkish-language year before the degree. Free to apply.'],
h:['التقديم عبر بوابة TBBS على موقع المنحة. لا يوجد وسطاء مخوّلون بالتقديم.','Apply online via the TBBS portal. No agents are authorized to apply on your behalf.'],
x:['الموعد غير معلن رسمياً بعد؛ المصادر تتوقع الفتح 10 يناير والإغلاق 20 فبراير 2027. تأكد من الموقع الرسمي.','Official dates are not yet announced; sources expect Jan 10 – Feb 20, 2027. Confirm on the official site.']},
{t:'program',f:'general',s:'high_school',src:'Yale Young Global Scholars',fund:'partial',dt:'2027-01-06',dk:['6 يناير 2027 (للمساعدة المالية)','Jan 6, 2027 (for financial aid)'],link:'https://globalscholars.yale.edu/',v:'2026-10-12',
ti:['Yale Young Global Scholars 2027','Yale Young Global Scholars 2027'],
ds:['برنامج صيفي أكاديمي من جامعة ييل لطلاب الثانوية من كل الدول، مع مساعدات مالية حسب الحاجة.','A Yale summer academic program for high-school students from all countries, with need-based financial aid.'],
e:['العمر 16–18 بحلول 18 يوليو 2027، في الصف 10 أو 11 (أو ما يعادله)، وإتقان الإنجليزية. تُقبل الطلبات من جميع الدول.','Age 16–18 by July 18, 2027; current sophomore or junior (or equivalent); English fluency. Applicants from all countries are accepted.'],

let lang=(()=>{try{return localStorage.getItem('swanLang')==='en'?'en':'ar'}catch(e){return'ar'}})();
const F={saved:false,type:'all',stage:'all',fund:'all',field:'all',due:'all',q:''};
const $=id=>document.getElementById(id),i=()=>lang==='en'?1:0,T=k=>L[lang][k];
const rk=d=>{const n=days(d);return n===null?9e9:n<0?1e9-n:n};
const days=d=>d.dt?Math.ceil((new Date(d.dt)-TODAY)/864e5):null;
const norm=s=>String(s).toLowerCase().normalize('NFKC').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');

const used=k=>[...new Set(ALL.map(d=>d[k]))];
const pick=(o,ks)=>Object.fromEntries(ks.map(k=>[k,o[k]]));

  $('q').placeholder=T('ph');
  $('bAr').setAttribute('aria-pressed',lang==='ar');$('bEn').setAttribute('aria-pressed',lang==='en');
  const ty=['all',...Object.keys(L.ar.types)];
  $('types').innerHTML=ty.map(k=>`<button type="button" data-v="${k}" aria-pressed="${F.type===k}">${k==='all'?T('all'):T('types')[k]}</button>`).join('');
  const dm={m:T('due').m,q:T('due').q,l:T('due').l};
  $('fStage').innerHTML=opt(T('stageAll'),pick(T('stage'),used('s')));
  $('fFund').innerHTML=opt(T('fundAll'),pick(T('fund'),used('fund')));
  $('fField').innerHTML=opt(T('fieldAll'),pick(T('field'),used('f')));
  $('fDue').innerHTML=opt(T('dueAll'),dm);
  $('fStage').value=F.stage;$('fFund').value=F.fund;$('fField').value=F.field;$('fDue').value=F.due;

}
function contactUI(){const c=$('ct');if(!c)return;c.style.display=CONTACT_EMAIL?'':'none';c.innerHTML=CONTACT_EMAIL?'<strong>'+T('contact')+'</strong><p style="margin:6px 0 0"><a href="mailto:'+CONTACT_EMAIL+'">'+CONTACT_EMAIL+'</a></p>':''}
function match(d){
  const n=days(d);
  const dueOk=F.due==='all'||(n!==null&&(F.due==='m'?n<=31:F.due==='q'?n<=92:n>92));
  const hay=norm([d.ti[0],d.ti[1],d.ds[0],d.ds[1],d.src,T('types')[d.t],T('field')[d.f],T('fund')[d.fund]].join(' '));
  const words=norm(F.q).split(/\s+/).filter(Boolean);
  return (!F.saved||getSaved().includes(d.ti[1]))&&(F.type==='all'||d.t===F.type)&&(F.stage==='all'||d.s===F.stage)&&(F.fund==='all'||d.fund===F.fund)&&(F.field==='all'||d.f===F.field)&&dueOk&&words.every(w=>hay.includes(w));
}
function render(){

}
function opn(d){if(!d.op)return `<div class="ver no">${T('opUnk')}</div>`;const o=d.op==='now'?0:Math.ceil((new Date(d.op)-TODAY)/864e5);return o>0?`<div class="ver" style="color:var(--acc)">◔ ${T('opens').replace('{n}',o)}</div>`:`<div class="ver">● ${T('open')}</div>`}

/* ===== accounts (Firebase Auth) ===== */
const FIREBASE_CONFIG={apiKey:'AIzaSyA2CWTG-WvHRMw_xueml_wF72JOjFuEqY4',authDomain:'swan-190db.firebaseapp.com',projectId:'swan-190db',appId:'1:1092430853041:web:f75ecbcc8ed36364728390'}; // ضع إعدادات مشروعك هنا
let A=null,user=null,amode='in';
const esc=x=>String(x).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const ini=u=>((u.displayName||u.email||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('')).toUpperCase();
const av=(u,c)=>'<span class="av'+(c?' '+c:'')+'">'+(u.photoURL?'<img alt="" src="'+esc(u.photoURL)+'">':esc(ini(u)))+'</span>';
const canSave=()=>!!(user&&user.emailVerified);
const sk=()=>'swanSaved:'+user.uid;
function getSaved(){if(!canSave())return[];try{return JSON.parse(localStorage.getItem(sk()))||[]}catch(e){return[]}}
const isSaved=d=>getSaved().includes(d.ti[1]);
function toggleSave(k){if(!canSave()){openA();return}const id=ALL[k].ti[1];let a=getSaved();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];try{localStorage.setItem(sk(),JSON.stringify(a))}catch(e){}render()}
async function initAuth(){
  if(!FIREBASE_CONFIG.apiKey){authUI();return}
  try{const u='https://www.gstatic.com/firebasejs/10.12.2/';
    const [app,au,fs]=await Promise.all([import(u+'firebase-app.js'),import(u+'firebase-auth.js'),import(u+'firebase-firestore.js')]);
    const ap=app.initializeApp(FIREBASE_CONFIG);
    A={...au,...fs,auth:au.getAuth(ap),db:fs.getFirestore(ap)};loadOpps();
    A.onAuthStateChanged(A.auth,x=>{user=x;isAdm=false;if(!canSave())F.saved=false;authUI();render();checkAdmin()});
  }catch(e){A=null;authUI()}
}
function authUI(){
  const a=$('acct');a.innerHTML=user?av(user)+'<span class="nm">'+esc((user.displayName||user.email).split(' ')[0])+'</span>':T('aLogin');a.setAttribute('aria-label',user?T('aMe'):T('aLogin'));a.classList.toggle('on',!!user);
  const bn=$('bn'),need=user&&!user.emailVerified;bn.style.display=need?'block':'none';
  if(need){bn.innerHTML=T('aBn')+' <button type="button" id="bnb">'+T('aVer')+'</button>';$('bnb').onclick=()=>openA()}
  if($('aov').classList.contains('open'))authView();
}
function openA(){authView();$('aov').classList.add('open');document.body.style.overflow='hidden';const f=$('aB').querySelector('input,button');f&&f.focus()}
function closeA(){$('aov').classList.remove('open');document.body.style.overflow=''}
$('ax').onclick=closeA;$('aov').onclick=e=>{if(e.target.id==='aov')closeA()};
const say=(t,ok)=>{const m=$('aM');if(m){m.textContent=t;m.className='msg '+(ok?'ok':'err')}};
const fail=e=>say((T('er')[e&&e.code])||(T('aBad')+' ['+((e&&e.code)||'unknown')+']'));
function authView(){
  const b=$('aB');
  if(!A){$('aT').textContent=T('aT');b.innerHTML='<p>'+T('aOff')+'</p>';return}
  A.auth.languageCode=lang;
  if(user){
    $('aT').textContent=user.emailVerified?T('aMe'):T('aVer');
    b.innerHTML='<div style="text-align:center">'+av(user,'big')+'<h4 style="margin:10px 0 0;font-size:20px">'+esc(user.displayName||'')+'</h4><div dir="ltr" style="color:var(--soft)">'+esc(user.email)+'</div></div>'+
      (user.emailVerified?'<p style="color:var(--ok)">✓ '+T('aOk')+'</p>':'<p>'+T('aSent')+'</p><button class="btn full" id="aChk" type="button">'+T('aChk')+'</button><button class="link" id="aRe" type="button">'+T('aRe')+'</button>')+
      (user.emailVerified?'<button class="sm" id="aSv2" type="button" style="width:100%;margin-top:14px">★ '+T('saved')+' ('+getSaved().length+')</button>':'')+(isAdm?'<button class="btn full" id="aAdm" type="button">لوحة التحكم</button>':'')+'<p><button class="link" id="aOut" type="button">'+T('aOut')+'</button></p><div class="msg" id="aM" aria-live="polite"></div>';
    if($('aChk'))$('aChk').onclick=async()=>{try{await user.reload();user=A.auth.currentUser;authUI();render();user.emailVerified?authView():say(T('aNo'))}catch(e){fail(e)}};
    if($('aRe'))$('aRe').onclick=async()=>{try{await A.sendEmailVerification(user);say(T('aRsn'),1)}catch(e){fail(e)}};
    if($('aSv2'))$('aSv2').onclick=()=>{closeA();F.saved=true;render();$('opps').scrollIntoView({behavior:'smooth'})};
    if($('aAdm'))$('aAdm').onclick=()=>{closeA();openAdm()};
    $('aOut').onclick=async()=>{await A.signOut(A.auth);closeA()};
    return}
  const up=amode==='up',rs=amode==='reset';
  $('aT').textContent=rs?T('aRs'):up?T('aUp'):T('aIn');
  b.innerHTML='<form id="aF" novalidate>'+(up?'<label class="fld" for="aN">'+T('aName')+'</label><input class="fi" id="aN" autocomplete="name">':'')+
    '<label class="fld" for="aE">'+T('aMail')+'</label><input class="fi" id="aE" type="email" inputmode="email" autocomplete="email" dir="ltr">'+
    (rs?'':'<label class="fld" for="aP">'+T('aPw').split(' (')[0]+'</label><input class="fi" id="aP" type="password" autocomplete="'+(up?'new':'current')+'-password" dir="ltr" placeholder="'+(up?T('aPw'):'')+'">')+
    '<button class="btn full" type="submit">'+(rs?T('aRs'):up?T('aUp'):T('aIn'))+'</button><div class="msg" id="aM" aria-live="polite"></div></form>'+
    '<p>'+(rs?'':'<button class="link" id="aFg" type="button">'+T('aFg')+'</button><br>')+'<button class="link" id="aSw" type="button">'+(up||rs?T('aSw2'):T('aSw1'))+'</button></p>';
  if($('aFg'))$('aFg').onclick=()=>{amode='reset';authView()};
  $('aSw').onclick=()=>{amode=up||rs?'in':'up';authView()};
  $('aF').onsubmit=async e=>{e.preventDefault();
    const em=$('aE').value.trim(),pw=$('aP')?$('aP').value:'',nm=$('aN')?$('aN').value.trim():'';
    if(!/^\S+@\S+\.\S+$/.test(em)||(!rs&&(up?pw.length<8:!pw)))return say(T('aBad'));
    try{
      if(rs){await A.sendPasswordResetEmail(A.auth,em);say(T('aRsd'),1)}
      else if(up){const c=await A.createUserWithEmailAndPassword(A.auth,em,pw);if(nm)await A.updateProfile(c.user,{displayName:nm});await A.sendEmailVerification(c.user);user=c.user;authUI();authView()}
      else{await A.signInWithEmailAndPassword(A.auth,em,pw)}
    }catch(x){fail(x)}};
}
/* ===== admin panel ===== */
let FS=[],isAdm=false;
const slug=x=>String(x).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('x'+Date.now());
function rebuild(){ALL=[...new Map([...D,...FS].map(d=>[slug(d.ti[1]),d])).values()].filter(d=>!d.deleted);ui()}
async function loadOpps(){try{const q=await A.getDocs(A.collection(A.db,'opps'));FS=q.docs.map(x=>x.data());rebuild()}catch(e){}}
async function checkAdmin(){if(!A||!A.db||!canSave())return;try{await A.getDoc(A.doc(A.db,'adminCheck','x'));isAdm=true;authUI()}catch(e){}}
function openAdm(){admList();$('mov').classList.add('open');document.body.style.overflow='hidden'}
function closeAdm(){$('mov').classList.remove('open');document.body.style.overflow=''}
$('mxx').onclick=closeAdm;$('mov').onclick=e=>{if(e.target.id==='mov')closeAdm()};
const inp=(id,lb,v,tp)=>`<label class="fld" for="f_${id}">${lb}</label>`+(tp==='t'?`<textarea class="fi ta" id="f_${id}">${esc(v||'')}</textarea>`:`<input class="fi" id="f_${id}" ${tp==='date'?'type="date"':''} value="${esc(v||'')}">`);
const sel=(id,lb,m,v)=>`<label class="fld" for="f_${id}">${lb}</label><select class="fi" id="f_${id}">`+Object.entries(m).map(([k,t])=>`<option value="${k}"${k===v?' selected':''}>${t}</option>`).join('')+'</select>';
function admList(){
  $('mT2').textContent='لوحة التحكم';
  $('mB2').innerHTML='<button class="btn full" id="aNew" type="button">＋ إضافة فرصة</button><button class="sm" id="aPs" type="button" style="width:100%;margin-top:8px">لصق فرصة جاهزة من Claude</button><p style="font-size:14px">عند تعديل فرصة موجودة أصلاً تُحفظ نسخة معدّلة وتحلّ محلها في الموقع.</p>'+ALL.map((d,k)=>`<div class="row2"><b>${esc(d.ti[0])}</b><button class="sm" data-e="${k}" type="button">تعديل</button><button class="sm" data-d="${k}" type="button">حذف</button></div>`).join('')+'<div class="msg" id="aM2"></div>';
  $('aNew').onclick=()=>admForm();$('aPs').onclick=admPaste;
  $('mB2').onclick=async e=>{const b=e.target.closest('.sm');if(!b)return;if(b.dataset.e!==undefined)return admForm(ALL[+b.dataset.e]);
    const d=ALL[+b.dataset.d];if(!confirm('حذف «'+d.ti[0]+'»؟'))return;
    try{const o={...d,deleted:true};await A.setDoc(A.doc(A.db,'opps',slug(d.ti[1])),o);FS=FS.filter(x=>slug(x.ti[1])!==slug(d.ti[1]));FS.push(o);rebuild();admList()}catch(x){$('aM2').className='msg err';$('aM2').textContent='تعذّر الحذف: '+x.code}}
}
function admPaste(){$('mT2').textContent='لصق فرصة جاهزة';$('mB2').innerHTML='<label class="fld" for="f_js">ألصقي الكود الذي أعطاكِ إياه Claude</label><textarea class="fi ta" id="f_js" dir="ltr" style="min-height:180px"></textarea><button class="btn full" id="aGo" type="button">عبّئ النموذج للمراجعة</button><button class="link" id="aBk" type="button">رجوع</button><div class="msg" id="aM2"></div>';
  $('aBk').onclick=admList;
  $('aGo').onclick=()=>{try{const o=JSON.parse($('f_js').value.replace(/```json|```/g,'').trim());if(!o||!Array.isArray(o.ti)||!Array.isArray(o.ds))throw 0;admForm({ti:['',''],ds:['',''],t:'scholarship',f:'general',s:'high_school',fund:'full',src:'',link:'',dt:'',...o},true)}catch(e){$('aM2').className='msg err';$('aM2').textContent='الكود غير صالح. انسخيه كاملاً كما أرسله Claude.'}}}
function admForm(d,nw){
  const o=d||{ti:['',''],ds:['',''],t:'scholarship',f:'general',s:'high_school',fund:'full',src:'',link:'',dt:''},P=(a,i)=>a?a[i]:'';
  $('mT2').textContent=d&&!nw?'تعديل فرصة':'إضافة فرصة';
  $('mB2').innerHTML=sel('t','النوع',L.ar.types,o.t)+sel('s','المرحلة',L.ar.stage,o.s)+sel('fund','التمويل',L.ar.fund,o.fund)+sel('f','المجال',L.ar.field,o.f)+
   inp('tiA','العنوان بالعربية',o.ti[0])+inp('tiE','Title (English)',o.ti[1])+inp('src','الجهة المنظمة',o.src)+inp('link','الرابط الرسمي (يبدأ بـ https://)',o.link)+
   inp('dsA','وصف مختصر بالعربية',o.ds[0],'t')+inp('dsE','Short description (English)',o.ds[1],'t')+
   inp('dt','آخر موعد للتقديم',o.dt,'date')+inp('op','تاريخ فتح التقديم',o.op&&o.op!=='now'?o.op:'','date')+
   `<label class="ck"><input type="checkbox" id="f_now"${o.op==='now'?' checked':''}> التقديم مفتوح الآن</label>`+
   inp('eA','من يحق له التقديم (عربي)',P(o.e,0),'t')+inp('eE','Eligibility (English)',P(o.e,1),'t')+
   inp('bA','ماذا تقدم (عربي)',P(o.b,0),'t')+inp('bE','Benefits (English)',P(o.b,1),'t')+
   inp('hA','طريقة التقديم (عربي)',P(o.h,0),'t')+inp('hE','How to apply (English)',P(o.h,1),'t')+
   '<label class="ck"><input type="checkbox" id="f_v"> تحققتُ من المعلومات اليوم من الموقع الرسمي</label>'+
   '<button class="btn full" id="aSv" type="button">حفظ</button><button class="link" id="aBk" type="button">رجوع</button><div class="msg" id="aM2"></div>';
  $('aBk').onclick=admList;
  $('aSv').onclick=async()=>{
    const g=i=>$('f_'+i).value.trim(),ck=i=>$('f_'+i).checked,msg=(t,ok)=>{$('aM2').className='msg '+(ok?'ok':'err');$('aM2').textContent=t};
    const r={t:g('t'),f:g('f'),s:g('s'),fund:g('fund'),src:g('src'),link:g('link'),ti:[g('tiA'),g('tiE')],ds:[g('dsA'),g('dsE')],dt:g('dt')};
    if(!r.ti[0]||!r.ti[1]||!r.src||!r.ds[0]||!r.ds[1])return msg('أكمل العنوان والوصف بالعربية والإنجليزية واسم الجهة.');
    if(!/^https:\/\//.test(r.link))return msg('الرابط يجب أن يبدأ بـ https://');
    const fm=(v,l)=>new Date(v).toLocaleDateString(l,{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
    r.dk=r.dt?[fm(r.dt,'ar-u-nu-latn'),fm(r.dt,'en-US')]:['يُعلن لاحقاً','To be announced'];
    if(ck('now')){r.op='now';r.od=['مفتوح الآن','Open now']}else if(g('op')){r.op=g('op');r.od=[fm(r.op,'ar-u-nu-latn'),fm(r.op,'en-US')]}
    for(const [k,a,b] of [['e','eA','eE'],['b','bA','bE'],['h','hA','hE']]){const x=g(a),y=g(b);if(x||y)r[k]=[x||y,y||x]}
    if(ck('v'))r.v=new Date().toISOString().slice(0,10);else if(d&&d.v)r.v=d.v;
    const id=slug(d&&!nw?d.ti[1]:r.ti[1]);
    try{await A.setDoc(A.doc(A.db,'opps',id),r);FS=FS.filter(x=>slug(x.ti[1])!==id);FS.push(r);rebuild();admList()}
    catch(x){msg(x.code==='permission-denied'?'لا تملكين صلاحية الكتابة. راجعي قواعد Firestore والبريد.':'تعذّر الحفظ: '+x.code)}
  };
}
ui();initAuth();
